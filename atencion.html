    btn.disabled=false;
    err.textContent=(typeof DecompressionStream==='undefined')?
      'Este navegador es muy viejo para el panel':'Contraseña incorrecta';
  }
}
document.getElementById('b').addEventListener('click',intentar);
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')intentar()});
if(sessionStorage.getItem('cp_vivo')==='1'&&sessionStorage.getItem('cp_vivo_p')){
  abrir(sessionStorage.getItem('cp_vivo_p')).catch(()=>{});
}
