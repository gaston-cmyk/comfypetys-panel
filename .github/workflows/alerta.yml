name: Mail de alertas
on:
  workflow_dispatch:
    inputs:
      asunto:
        required: true
      cuerpo:
        required: true
permissions:
  contents: read
  issues: write
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar cuerpo
        env:
          CUERPO: ${{ inputs.cuerpo }}
        run: printf '%s' "$CUERPO" > cuerpo.txt
      - name: Enviar mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ inputs.asunto }}
          to: cobranzas@comfypetys.com
          from: Sistema ComfyPetys <cobranzas@comfypetys.com>
          body: file://cuerpo.txt
      - name: Avisar fallo (meta-alerta)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo ${{ github.repository }} --title "🚨 FALLÓ el envío del mail de alertas" --body "Revisar el run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (¿app password de Gmail vencido?)" || true
